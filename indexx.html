<script>
// ======================================================
// PARTIE 1/4 — CONFIGURATION ET CONNEXION
// Le même script continuera en PARTIE 2, 3 et 4.
// ======================================================

// ------------------------------------------------------
// CONFIGURATION SUPABASE
// ------------------------------------------------------

// REMPLACER ces deux valeurs par les informations
// de ton projet Supabase.

const SUPABASE_URL = "https://TON-PROJET.supabase.co";
const SUPABASE_ANON_KEY = "TA_CLE_ANON_PUBLIC";

let supabaseClient = null;

if (
  SUPABASE_URL !== "https://TON-PROJET.supabase.co" &&
  SUPABASE_ANON_KEY !== "TA_CLE_ANON_PUBLIC"
) {
  const { createClient } = window.supabase;

  supabaseClient = createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );
}

// ------------------------------------------------------
// VARIABLES GLOBALES
// ------------------------------------------------------

let currentUser = null;
let currentProfile = null;
let currentMemberships = [];
let currentBranches = [];
let currentBranch = null;
let currentPage = "dashboard";

let medicinesCache = [];
let stockCache = [];
let saleCart = [];

window.saleCart = saleCart;

// ------------------------------------------------------
// OUTILS
// ------------------------------------------------------

function $(id) {
  return document.getElementById(id);
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function formatMoney(value) {
  return Number(value || 0).toLocaleString("fr-FR") + " BIF";
}

function formatDate(value) {
  if (!value) return "—";

  return new Date(value).toLocaleDateString("fr-FR");
}

function toast(message) {
  const container = $("toastContainer");
  if (!container) {
    alert(message);
    return;
  }

  const notification = document.createElement("div");
  notification.className = "toast-message";
  notification.textContent = String(message);

  container.appendChild(notification);

  setTimeout(() => {
    notification.remove();
  }, 4000);
}

// ------------------------------------------------------
// ETAT DE CONNEXION INTERNET
// ------------------------------------------------------

function updateConnectionStatus() {
  const element = $("connectionStatus");
  if (!element) return;

  element.textContent = navigator.onLine
    ? "🟢 En ligne"
    : "🔴 Hors ligne";
}

window.addEventListener("online", updateConnectionStatus);
window.addEventListener("offline", updateConnectionStatus);

// ------------------------------------------------------
// VERIFICATION SUPABASE
// ------------------------------------------------------

function checkSupabaseConfiguration() {
  if (!supabaseClient) {
    toast("Configurez votre URL et clé Supabase dans index.html.");
    return false;
  }

  return true;
}

// ------------------------------------------------------
// ROLES ET PERMISSIONS
// ------------------------------------------------------

function getUserRoles() {
  return currentMemberships.map(item => item.role);
}

function isSuperAdmin() {
  return getUserRoles().includes("SUPER_ADMIN");
}

function hasRole(roles) {
  return currentMemberships.some(item =>
    roles.includes(item.role)
  );
}

function canSell() {
  return hasRole([
    "SUPER_ADMIN",
    "DIRECTOR",
    "BRANCH_MANAGER",
    "PHARMACIST",
    "CASHIER"
  ]);
}

function canManageMedicines() {
  return hasRole([
    "SUPER_ADMIN",
    "DIRECTOR",
    "BRANCH_MANAGER",
    "PHARMACIST",
    "STOREKEEPER"
  ]);
}

function canManageStock() {
  return hasRole([
    "SUPER_ADMIN",
    "DIRECTOR",
    "BRANCH_MANAGER",
    "STOREKEEPER"
  ]);
}

function canViewReports() {
  return hasRole([
    "SUPER_ADMIN",
    "DIRECTOR",
    "BRANCH_MANAGER",
    "ACCOUNTANT"
  ]);
}

function getAccessibleBranchIds() {
  if (isSuperAdmin()) {
    return currentBranches.map(branch => branch.id);
  }

  return [
    ...new Set(
      currentMemberships
        .flatMap(item => item.branch_ids || [])
    )
  ];
}

// ------------------------------------------------------
// AFFICHER APPLICATION
// ------------------------------------------------------

function showApp() {
  $("loginScreen")?.classList.add("hidden");
  $("appScreen")?.classList.remove("hidden");

  if ($("userInfo")) {
    $("userInfo").textContent =
      currentProfile?.full_name || currentUser?.email || "";
  }
}

function showLogin() {
  $("appScreen")?.classList.add("hidden");
  $("loginScreen")?.classList.remove("hidden");
}

  
// ------------------------------------------------------
// CHARGEMENT PROFIL UTILISATEUR
// ------------------------------------------------------

async function loadUserData() {
  if (!supabaseClient || !currentUser) {
    throw new Error("Session utilisateur introuvable.");
  }

  const userId = currentUser.id;

  const profileResult = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", userId)
    .maybeSingle();

  if (profileResult.error) {
    throw profileResult.error;
  }

  if (!profileResult.data) {
    throw new Error("Profil utilisateur introuvable.");
  }

  currentProfile = profileResult.data;

  if (currentProfile.is_active === false) {
    throw new Error("Votre compte est désactivé.");
  }

  const membershipResult = await supabaseClient
    .from("memberships")
    .select("*")
    .eq("user_id", userId);

  if (membershipResult.error) {
    throw membershipResult.error;
  }

  currentMemberships = membershipResult.data || [];

  if (!currentMemberships.length) {
    throw new Error("Aucun rôle ou accès pharmacie attribué.");
  }

  const branchResult = await supabaseClient
    .from("branches")
    .select("*")
    .eq("is_active", true);

  if (branchResult.error) {
    throw branchResult.error;
  }

  const allBranches = branchResult.data || [];
  const accessibleIds = getAccessibleBranchIds();

  currentBranches = isSuperAdmin()
    ? allBranches
    : allBranches.filter(branch =>
        accessibleIds.includes(branch.id)
      );

  if (!currentBranches.length) {
    throw new Error("Aucune pharmacie accessible.");
  }

  currentBranch = currentBranches[0];

  showApp();

  await showPage("dashboard");
}

// ------------------------------------------------------
// CONNEXION
// ------------------------------------------------------


async function login(event) {
  if (event) event.preventDefault();

  const button = $("loginButton");
  const message = $("loginMessage");

  try {

    // VERIFICATION SUPABASE
    if (
      typeof supabaseClient === "undefined" ||
      !supabaseClient
    ) {
      throw new Error("Configuration Supabase introuvable.");
    }

    if (typeof checkSupabaseConfiguration === "function") {
      if (!checkSupabaseConfiguration()) return;
    }

    const email = $("loginEmail")?.value.trim();
    const password = $("loginPassword")?.value;

    if (!email || !password) {
      toast("Veuillez remplir email et mot de passe.");
      return;
    }

    if (button) {
      button.disabled = true;
      button.textContent = "CONNEXION...";
    }

    if (message) {
      message.textContent = "";
    }

    // AUTHENTIFICATION
    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) throw error;

    if (!data.user) {
      throw new Error("Utilisateur non trouvé.");
    }

    currentUser = data.user;

    // CHARGEMENT DES DONNEES
    await loadUserData();

    toast("Connexion réussie.");

  } catch (error) {

    console.error("ERREUR LOGIN :", error);

    if (message) {
      message.textContent = error.message;
      message.style.color = "#dc2626";
    }

    toast("Connexion impossible : " + error.message);

    currentUser = null;
    currentProfile = null;
    currentMemberships = [];
    currentBranches = [];
    currentBranch = null;

    try {
      await supabaseClient.auth.signOut();
    } catch (signOutError) {
      console.error(signOutError);
    }

    showLogin();

  } finally {

    if (button) {
      button.disabled = false;
      button.textContent = "SE CONNECTER";
    }

  }
}


// ------------------------------------------------------
// DECONNEXION
// ------------------------------------------------------

async function logout() {

  if (!supabaseClient) return;

  const { error } =
    await supabaseClient.auth.signOut();

  if (error) {
    toast("Erreur de déconnexion : " + error.message);
    return;
  }

  currentUser = null;
  currentProfile = null;
  currentMemberships = [];
  currentBranches = [];
  currentBranch = null;

  medicinesCache = [];
  stockCache = [];

  saleCart = [];

  window.saleCart = saleCart;

  showLogin();

  toast("Vous êtes déconnecté.");
}


// ------------------------------------------------------
// DECONNEXION
// ------------------------------------------------------

async function logout() {
  if (!supabaseClient) return;

  const { error } = await supabaseClient.auth.signOut();

  if (error) {
    toast("Erreur de déconnexion : " + error.message);
    return;
  }

  currentUser = null;
  currentProfile = null;
  currentMemberships = [];
  currentBranches = [];
  currentBranch = null;

  medicinesCache = [];
  stockCache = [];
  saleCart = [];
  window.saleCart = saleCart;

  showLogin();
  toast("Vous êtes déconnecté.");
}

// ------------------------------------------------------
// RESTAURATION SESSION
// ------------------------------------------------------

async function restoreSession() {
  if (!checkSupabaseConfiguration()) {
    showLogin();
    return;
  }

  try {
    const { data, error } = await supabaseClient.auth
      .getSession();

    if (error) throw error;

    if (!data.session) {
      showLogin();
      return;
    }

    currentUser = data.session.user;

    await loadUserData();

  } catch (error) {
    console.error("Restauration session :", error);

    currentUser = null;
    currentProfile = null;
    currentMemberships = [];
    currentBranches = [];
    currentBranch = null;

    showLogin();
    toast(error.message);
  }
}

// ------------------------------------------------------
// EVENEMENTS DE BASE
// ------------------------------------------------------

$("loginForm")?.addEventListener("submit", login);

$("logoutButton")?.addEventListener("click", logout);

// ------------------------------------------------------
// CHANGEMENT DE PHARMACIE
// ------------------------------------------------------

async function changeBranch(branchId) {
  const branch = currentBranches.find(
    item => item.id === branchId
  );

  if (!branch) {
    toast("Vous n'avez pas accès à cette pharmacie.");
    return;
  }

  currentBranch = branch;

  medicinesCache = [];
  stockCache = [];

  toast("Pharmacie sélectionnée : " + branch.name);

  if (typeof showPage === "function") {
    await showPage(currentPage);
  }
}

// ------------------------------------------------------
// INITIALISATION
// ------------------------------------------------------

updateConnectionStatus();

// Attendre que la page soit complètement chargée.
window.addEventListener("DOMContentLoaded", () => {
  restoreSession();
});

// ======================================================
// FIN PARTIE 1/4
// Ne pas fermer le script ici.
// PARTIE 2/4 continuera dans ce même script.
// ======================================================



// ======================================================
// PARTIE 2/4 — MEDICAMENTS, STOCK, LOTS ET ALERTES
// Continuer dans le même script de PARTIE 1/4
// ======================================================

// ------------------------------------------------------
// SELECTION PHARMACIE
// ------------------------------------------------------

function branchSelectorHTML() {
  if (!currentBranches.length) return "";

  return `
    <div class="form-group">
      <label>Pharmacie active</label>
      <select id="activeBranchSelector">
        ${currentBranches.map(branch => `
          <option value="${escapeHTML(branch.id)}"
            ${currentBranch?.id === branch.id ? "selected" : ""}>
            ${escapeHTML(branch.name)}
          </option>
        `).join("")}
      </select>
    </div>
  `;
}

// ------------------------------------------------------
// PAGE ACCUEIL
// ------------------------------------------------------

async function renderDashboard() {
  const page = $("pageContent");
  if (!page) return;

  page.innerHTML = `
    <div class="page-header">
      <div>
        <h2>Tableau de bord</h2>
        <p>Bienvenue ${escapeHTML(currentProfile?.full_name || "")}</p>
      </div>
    </div>

    <div class="card">
      ${branchSelectorHTML()}
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <span>Médicaments enregistrés</span>
        <strong id="dashboardMedicineCount">—</strong>
      </div>

      <div class="stat-card">
        <span>Lots en stock</span>
        <strong id="dashboardBatchCount">—</strong>
      </div>

      <div class="stat-card">
        <span>Unités en stock</span>
        <strong id="dashboardStockCount">—</strong>
      </div>

      <div class="stat-card">
        <span>Alertes</span>
        <strong id="dashboardAlertCount">—</strong>
      </div>

async function saveMedicine(event) {
  event.preventDefault();

  if (!canManageMedicines()) {
    toast("Permission refusée.");
    return;
  }

  const id = $("medicineId").value;

  const medicine = {
    code: $("medicineCode").value.trim(),
    barcode: $("medicineBarcode").value.trim() || null,
    name: $("medicineName").value.trim(),
    generic_name: $("medicineGenericName").value.trim() || null,
    strength: $("medicineStrength").value.trim() || null,
    dosage_form: $("medicineDosageForm").value || null,
    manufacturer: $("medicineManufacturer").value.trim() || null,
    purchase_price: Number($("medicinePurchasePrice").value || 0),
    selling_price: Number($("medicineSellingPrice").value || 0),
    min_stock_level: Number($("medicineMinStock").value || 0),
    is_active: true
  };

  if (!medicine.code || !medicine.name) {
    toast("Code et nom du médicament obligatoires.");
    return;
  }

  if (
    medicine.purchase_price < 0 ||
    medicine.selling_price <= 0 ||
    medicine.min_stock_level < 0
  ) {
    toast("Vérifiez les prix et le stock minimum.");
    return;
  }

  try {
    let result;

    if (id) {
      result = await supabaseClient
        .from("medicines")
        .update(medicine)
        .eq("id", id);
    } else {
      result = await supabaseClient
        .from("medicines")
        .insert(medicine);
    }

    if (result.error) throw result.error;

    toast("Médicament enregistré avec succès.");

    await renderMedicines();

  } catch (error) {
    console.error(error);
    toast("Erreur médicament : " + error.message);
  }
}

// ------------------------------------------------------
// ALERTES STOCK ET PEREMPTION
// ------------------------------------------------------

function getStockAlerts() {
  const alerts = [];
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  stockCache.forEach(batch => {
    const quantity = Number(batch.quantity_base_units || 0);
    const expiry = batch.expiry_date
      ? new Date(batch.expiry_date)
      : null;

    const name = batch.medicines?.name || "Médicament";
    const minimum = Number(
      batch.medicines?.min_stock_level || 0
    );

    if (expiry) {
      expiry.setHours(0, 0, 0, 0);

      if (expiry < today && quantity > 0) {
        alerts.push({
          type: "danger",
          title: "Médicament périmé",
          message: name + " — Lot " + (batch.lot_number || "N/A")
        });
      } else {
        const days = Math.ceil(
          (expiry - today) / 86400000
        );

        if (days >= 0 && days <= 90 && quantity > 0) {
          alerts.push({
            type: "warning",
            title: "Expiration proche",
            message: name + " — expire dans " + days + " jours"
          });
        }
      }
    }

    if (minimum > 0 && quantity > 0 && quantity <= minimum) {
      alerts.push({
        type: "warning",
        title: "Stock faible",
        message: name + " — quantité " + quantity
      });
    }

    if (quantity <= 0) {
      alerts.push({
        type: "danger",
        title: "Stock épuisé",
        message: name + " — Lot " + (batch.lot_number || "N/A")
      });
    }
  });

  return alerts;
}

function validPositiveNumber(value) {
  const number = Number(value);

  return Number.isFinite(number) && number > 0;
}


// ------------------------------------------------------
// OUTIL : DATE AU FORMAT YYYY-MM-DD
// ------------------------------------------------------

function getTodayISO() {
  const date = new Date();

  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");

  return `${year}-${month}-${day}`;
}


// ------------------------------------------------------
// OUTIL : STOCK DISPONIBLE D'UN MEDICAMENT
// ------------------------------------------------------

function getAvailableStock(medicineId) {
  const today = getTodayISO();

  return stockCache
    .filter(batch => {
      const quantity = Number(batch.quantity_base_units || 0);

      const notExpired =
        !batch.expiry_date || batch.expiry_date >= today;

      const availableStatus =
        !batch.status ||
        ["AVAILABLE", "ACTIVE", "DISPONIBLE"].includes(
          String(batch.status).toUpperCase()
        );

      return (
        batch.medicine_id === medicineId &&
        quantity > 0 &&
        notExpired &&
        availableStatus
      );
    })
    .reduce(
      (total, batch) =>
        total + Number(batch.quantity_base_units || 0),
      0
    );
}


// ------------------------------------------------------
// OUTIL : PRIX DE VENTE D'UN MEDICAMENT
// ------------------------------------------------------

function getMedicineSellingPrice(medicineId) {
  const medicine = medicinesCache.find(
    item => item.id === medicineId
  );

  if (!medicine) return 0;

  const availableBatch = stockCache.find(batch => {
    return (
      batch.medicine_id === medicineId &&
      Number(batch.quantity_base_units || 0) > 0 &&
      batch.selling_price !== null &&
      batch.selling_price !== undefined
    );
  });

  return Number(
    availableBatch?.selling_price ??
    medicine.selling_price ??
    0
  );
}

async function showPage(pageName) {

  // 1. Vérifier la session
  if (!currentUser || !currentProfile) {
    showLogin();
    return;
  }

  // 2. Vérifier le nom de la page
  const allowedPages = [
    "dashboard",
    "medicines",
    "stock",
    "sales",
    "reception",
    "invoice",
    "branches",
    "employees",
    "reports",
    "history",
    "alerts"
  ];

  if (!allowedPages.includes(pageName)) {
    pageName = "dashboard";
  }

  // 3. Enregistrer la page active
  currentPage = pageName;

  // 4. Mettre à jour le menu actif
  document.querySelectorAll("[data-page]").forEach(button => {

    const isActive = button.dataset.page === pageName;

    button.classList.toggle("active", isActive);

    if (isActive) {
      button.setAttribute("aria-current", "page");
    } else {
      button.removeAttribute("aria-current");
    }
  });

  // 5. Vérifier la zone de contenu
  const page = $("pageContent");

  if (!page) {
    console.error("Élément #pageContent introuvable.");
    return;
  }

  // 6. Afficher le chargement
  page.innerHTML = `
    <div class="card">
      <p>Chargement de la page...</p>
    </div>
  `;

  try {

    // 7. Charger la page demandée
    switch (pageName) {

      // ----------------------------------------------
      // ACCUEIL
      // ----------------------------------------------

      case "dashboard":
        await renderDashboard();
        break;


      // ----------------------------------------------
      // MEDICAMENTS
      // ----------------------------------------------

      case "medicines":
        await renderMedicines();
        break;


      // ----------------------------------------------
      // STOCK
      // ----------------------------------------------

      case "stock":
        await renderStock();
        break;


      // ----------------------------------------------
      // VENTES
      // ----------------------------------------------

      case "sales":
        await renderSales();
        break;


      // ----------------------------------------------
      // RECEPTIONS
      // ----------------------------------------------

      case "reception":
        await renderReception();
        break;


      // ----------------------------------------------
      // FACTURES
      // ----------------------------------------------

      case "invoice":
        renderInvoice();
        break;


      // ----------------------------------------------
      // PHARMACIES
      // ----------------------------------------------

      case "branches":
        await renderBranches();
        break;


      // ----------------------------------------------
      // EMPLOYES
      // ----------------------------------------------

      case "employees":
        await renderEmployees();
        break;


      // ----------------------------------------------
      // RAPPORTS
      // ----------------------------------------------

      case "reports":
        await renderReports();
        break;


      // ----------------------------------------------
      // HISTORIQUE
      // ----------------------------------------------

      case "history":
        await renderHistory();
        break;


      // ----------------------------------------------
      // ALERTES
      // ----------------------------------------------

      case "alerts":
        await renderAlerts();
        break;


      // ----------------------------------------------
      // PAGE INCONNUE
      // ----------------------------------------------

      default:

        currentPage = "dashboard";

        await renderDashboard();

        break;
    }

  } catch (error) {

    console.error(
      "Erreur navigation " + pageName + " :",
      error
    );

    page.innerHTML = `
      <div class="card">
        <h3>Erreur de chargement</h3>

        <p>

        <button
          type="button"
          class="btn btn-primary"
          id="retryCurrentPageButton">
          Réessayer
        </button>
      </div>
    `;
  }
}

// ------------------------------------------------------
// AJOUTER UN MEDICAMENT AU PANIER
// ------------------------------------------------------

async function addSaleItem() {
  if (!canSell()) {
    toast("Permission de vente refusée.");
    return;
  }

  const medicineId = $("saleMedicine")?.value;

  const quantity = Number($("saleQuantity")?.value || 0);

  if (!medicineId) {
    toast("Sélectionnez un médicament.");
    return;
  }

  if (
    !Number.isInteger(quantity) ||
    quantity <= 0
  ) {
    toast("La quantité doit être un nombre entier positif.");
    return;
  }

  const medicine = medicinesCache.find(
    item => item.id === medicineId
  );

  if (!medicine) {
    toast("Médicament introuvable.");
    return;
  }

  const available = getAvailableStock(medicineId);

  const alreadyInCart = saleCart
    .filter(item => item.medicine_id === medicineId)
    .reduce((sum, item) => sum + item.quantity, 0);

  if (alreadyInCart + quantity > available) {
    toast(
      `Stock insuffisant. Disponible : ${Math.max(
        0,
        available - alreadyInCart
      )} unité(s).`
    );
    return;
  }

  const price = getMedicineSellingPrice(medicineId);

  if (!validPositiveNumber(price)) {
    toast("Prix de vente invalide pour ce médicament.");
    return;
  }

  const existing = saleCart.find(
    item => item.medicine_id === medicineId
  );

  if (existing) {
    existing.quantity += quantity;
  } else {
    saleCart.push({
      medicine_id: medicineId,
      medicine_name: medicine.name,
      code: medicine.code,
      quantity,
      unit_price: price
    });
  }

  window.saleCart = saleCart;

  $("saleQuantity").value = "1";

  renderSaleCart();
}


// ------------------------------------------------------
// AFFICHER LE PANIER
// ------------------------------------------------------

function renderSaleCart() {
  const tbody = $("saleCartBody");

  if (!tbody) return;

  if (!saleCart.length) {
    tbody.innerHTML = `
      <tr>
        <td colspan="5" class="empty-state">
          Le panier est vide.
        </td>
      </tr>
    `;
  } else {
    tbody.innerHTML = saleCart.map((item, index) => {
      const total = item.quantity * item.unit_price;

      return `
        <tr>
          <td>
            <strong>${escapeHTML(item.medicine_name)}</strong>
            <small>${escapeHTML(item.code || "")}</small>
          </td>

          <td>${item.quantity}</td>

          <td>${formatMoney(item.unit_price)}</td>

          <td>${formatMoney(total)}</td>

          <td>
            <button
              type="button"
              class="btn btn-secondary"
              data-remove-sale-item="${index}">
              Supprimer
            </button>
          </td>
        </tr>
      `;
    }).join("");
  }

  updateSaleTotals();
}


// ------------------------------------------------------
// CALCUL DES TOTAUX
// ------------------------------------------------------

function updateSaleTotals() {
  const subtotal = saleCart.reduce(
    (sum, item) =>
      sum + item.quantity * item.unit_price,
    0
  );

  const discount = Number(
    $("saleDiscount")?.value || 0
  );

  const safeDiscount =
    Number.isFinite(discount) && discount >= 0
      ? discount
      : 0;

  const total = Math.max(0, subtotal - safeDiscount);

  if ($("saleSubtotal")) {
    $("saleSubtotal").textContent = formatMoney(subtotal);
  }

  if ($("saleDiscountDisplay")) {
    $("saleDiscountDisplay").textContent =
      formatMoney(safeDiscount);
  }

  if ($("saleGrandTotal")) {
    $("saleGrandTotal").textContent = formatMoney(total);
  }
}


// ------------------------------------------------------
// SUPPRIMER UN ARTICLE DU PANIER
// ------------------------------------------------------

function removeSaleItem(index) {
  if (
    !Number.isInteger(index) ||
    index < 0 ||
    index >= saleCart.length
  ) {
    return;
  }

  saleCart.splice(index, 1);

  window.saleCart = saleCart;

  renderSaleCart();
}


// ------------------------------------------------------
// VALIDATION ET ENREGISTREMENT DE LA VENTE
// IMPORTANT : TRANSACTION SUPABASE RPC
// ------------------------------------------------------

async function completeSale() {
  if (!canSell()) {
    toast("Vous n'avez pas la permission de vendre.");
    return;
  }

  if (!currentBranch || !saleCart.length) {
    toast("Panier vide ou pharmacie non sélectionnée.");
    return;
  }

  const discount = Number(
    $("saleDiscount")?.value || 0
  );

  const subtotal = saleCart.reduce(
    (sum, item) =>
      sum + item.quantity * item.unit_price,
    0
  );

  if (
    !Number.isFinite(discount) ||
    discount < 0 ||
    discount > subtotal
  ) {
    toast("Remise invalide.");
    return;
  }

  const paymentMethod =
    $("salePaymentMethod")?.value || "CASH";

  const items = saleCart.map(item => ({
    medicine_id: item.medicine_id,
    quantity: item.quantity,
    unit_price: item.unit_price
  }));

  // Vérification locale avant d'appeler la base.
  // La vérification définitive doit être faite dans PostgreSQL.

  for (const item of items) {
    const available = getAvailableStock(item.medicine_id);

    if (item.quantity > available) {
      toast(
        "Stock insuffisant pour " +
        saleCart.find(
          row => row.medicine_id === item.medicine_id
        )?.medicine_name
      );
      await loadStock();
      return;
    }
  }

  const button = $("completeSaleButton");

  if (button) {
    button.disabled = true;
    button.textContent = "Enregistrement...";
  }

  try {
    const payload = {
      p_branch_id: currentBranch.id,

      p_items: items,

      p_discount: discount,

      p_payment_method: paymentMethod,

      p_customer_name:
        $("saleCustomerName")?.value.trim() || null,

      p_customer_phone:
        $("saleCustomerPhone")?.value.trim() || null
    };

    const { data, error } = await supabaseClient.rpc(
      "complete_pharmacy_sale",
      payload
    );

    if (error) throw error;

    if (!data) {
      throw new Error(
        "La base de données n'a retourné aucune facture."
      );
    }

    saleInvoiceCache = Array.isArray(data)
      ? data[0]
      : data;

    if (
      !saleInvoiceCache ||
      typeof saleInvoiceCache !== "object"
    ) {
      throw new Error("Réponse de facture invalide.");
    }

    await loadStock();

    saleCart = [];
    window.saleCart = saleCart;

    toast("Vente enregistrée avec succès.");

    renderInvoice();

  } catch (error) {
    console.error("Erreur vente :", error);

    toast(
      "Vente non enregistrée : " + error.message
    );

    await loadStock();

  } finally {
    if (button) {
      button.disabled = false;
      button.textContent =
        "Valider la vente et générer la facture";
    }
  }
}

// ------------------------------------------------------
// CALCUL QUANTITE RECEPTION
// ------------------------------------------------------

function calculateReceptionQuantity() {
  const cartons = Number(
    $("receptionCartons")?.value || 0
  );

  const boxes = Number(
    $("receptionBoxesPerCarton")?.value || 1
  );

  const quantity = Number(
    $("receptionQuantity")?.value || 0
  );

  const total = quantity > 0
    ? quantity
    : cartons * boxes;

  if ($("receptionQuantityInfo")) {
    $("receptionQuantityInfo").textContent =
      "Quantité totale : " + total + " unité(s)";
  }

  return total;
}


// ------------------------------------------------------
// ENREGISTRER RECEPTION
// Transaction sécurisée dans PostgreSQL
// ------------------------------------------------------

async function saveReception(event) {
  event.preventDefault();

  if (!canManageStock()) {
    toast("Permission refusée.");
    return;
  }

  if (!currentBranch) {
    toast("Aucune pharmacie sélectionnée.");
    return;
  }

  const medicineId = $("receptionMedicine")?.value;

  const lotNumber = $("receptionLot")?.value.trim();

  const expiryDate = $("receptionExpiry")?.value;

  const quantity = calculateReceptionQuantity();

  const purchasePrice = Number(
    $("receptionPurchasePrice")?.value || 0
  );

  const sellingPrice = Number(
    $("receptionSellingPrice")?.value || 0
  );

  const boxesPerCarton = Number(
    $("receptionBoxesPerCarton")?.value || 1
  );

  if (!medicineId || !lotNumber || !expiryDate) {
    toast("Veuillez remplir les champs obligatoires.");
    return;
  }

  if (
    !Number.isInteger(quantity) ||
    quantity <= 0 ||
    !Number.isInteger(boxesPerCarton) ||
    boxesPerCarton <= 0
  ) {
    toast("Quantité ou nombre de boîtes invalide.");
    return;
  }

  if (
    !Number.isFinite(purchasePrice) ||
    purchasePrice < 0 ||
    !validPositiveNumber(sellingPrice)
  ) {
    toast("Vérifiez les prix d'achat et de vente.");
    return;
  }

  if (expiryDate < getTodayISO()) {
    toast("La date de péremption est déjà dépassée.");
    return;
  }

  const button = $("saveReceptionButton");

  if (button) {
    button.disabled = true;
    button.textContent = "Enregistrement...";
  }

  try {
    const payload = {
      p_branch_id: currentBranch.id,
      p_medicine_id: medicineId,
      p_lot_number: lotNumber,
      p_expiry_date: expiryDate,
      p_quantity: quantity,
      p_purchase_price: purchasePrice,
      p_selling_price: sellingPrice,
      p_boxes_per_carton: boxesPerCarton
    };

    const { data, error } = await supabaseClient.rpc(
      "receive_pharmacy_stock",
      payload
    );

    if (error) throw error;

    await loadStock();

    toast("Réception enregistrée avec succès.");

    $("receptionForm")?.reset();

    $("receptionBoxesPerCarton").value = "1";
    $("receptionCartons").value = "0";

    calculateReceptionQuantity();

  } catch (error) {
    console.error("Erreur réception :", error);

    toast(
      "Réception non enregistrée : " + error.message
    );

  } finally {
    if (button) {
      button.disabled = false;
      button.textContent = "Enregistrer la réception";
    }
  }
}

$("pageContent")?.addEventListener("click", async event => {

  const addButton = event.target.closest("#addSaleItem");

  if (addButton) {
    await addSaleItem();
    return;
  }

  const removeButton =
    event.target.closest("[data-remove-sale-item]");

  if (removeButton) {
    removeSaleItem(
      Number(removeButton.dataset.removeSaleItem)
    );
    return;
  }

  const completeButton =
    event.target.closest("#completeSaleButton");

  if (completeButton) {
    await completeSale();
    return;
  }

  const cancelButton =
    event.target.closest("#cancelSaleButton");

  if (cancelButton) {
    saleCart = [];
    window.saleCart = saleCart;
    await showPage("dashboard");
    toast("Vente annulée.");
    return;
  }

  const printButton =
    event.target.closest("#printInvoiceButton");

  if (printButton) {
    printInvoice();
    return;

// ------------------------------------------------------

// ------------------------------------------------------

async function generateReports() {
  const results = $("reportResults");
  if (!results) return;

  const startDate = $("reportStartDate")?.value;
  const endDate = $("reportEndDate")?.value;

  if (!startDate || !endDate || startDate > endDate) {
    toast("Période de rapport invalide.");
    return;
  }

  results.innerHTML = `
    <div class="card">Chargement des données...</div>
  `;

  try {
    let query = supabaseClient
      .from("sales")
      .select("*")
      .gte("created_at", startDate + "T00:00:00")
      .lte("created_at", endDate + "T23:59:59")
      .order("created_at", { ascending: false });

    if (!isSuperAdmin() && currentBranch) {
      query = query.eq("branch_id", currentBranch.id);
    } else if (isSuperAdmin() && currentBranch) {
      query = query.eq("branch_id", currentBranch.id);
    }

    const { data: sales, error } = await query;

    if (error) throw error;

    await loadStock();

    const rows = sales || [];

    const totalSales = rows.reduce(
      (sum, sale) =>
        sum + Number(
          sale.total_amount ??
          sale.total ??
          0
        ),
      0
    );

    const totalDiscount = rows.reduce(
      (sum, sale) =>
        sum + Number(
          sale.discount_amount ??
          sale.discount ??
          0
        ),
      0
    );

    const stockUnits = stockCache.reduce(
      (sum, batch) =>
        sum + Number(batch.quantity_base_units || 0),
      0
    );

    const stockValue = stockCache.reduce(
      (sum, batch) =>
        sum +
        Number(batch.quantity_base_units || 0) *
        Number(batch.purchase_price || 0),
      0
    );

    results.innerHTML = `
      <div class="stats-grid">

        <div class="stat-card">
          <span>Nombre de ventes</span>
          <strong>${rows.length}</strong>
        </div>

        <div class="stat-card">
          <span>Chiffre d'affaires</span>
          <strong>${formatMoney(totalSales)}</strong>
        </div>

        <div class="stat-card">
          <span>Remises accordées</span>
          <strong>${formatMoney(totalDiscount)}</strong>
        </div>

        <div class="stat-card">
          <span>Unités en stock</span>
          <strong>${stockUnits}</strong>
        </div>

        <div class="stat-card">
          <span>Valeur d'achat du stock</span>
          <strong>${formatMoney(stockValue)}</strong>
        </div>

      </div>

      <div class="card">
        <h3>Détail des ventes</h3>

        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Facture</th>
                <th>Client</th>
                <th>Paiement</th>
                <th>Total</th>
              </tr>
            </thead>

            <tbody>
              ${rows.map(sale => `
                <tr>
                  <td>${displayValue(formatDate(sale.created_at))}</td>

                  <td>
                    ${displayValue(
                      sale.invoice_number ||
                      sale.sale_number ||
                      sale.id
                    )}
                  </td>

                  <td>${displayValue(sale.customer_name)}</td>

                  <td>${displayValue(sale.payment_method)}</td>

                  <td>
                    ${formatMoney(
                      sale.total_amount ??
                      sale.total ??
                      0
                    )}
                  </td>
                </tr>
              `).join("")}

              ${rows.length === 0
                ? `
                  <tr>
                    <td colspan="5" class="empty-state">
                      Aucune vente pendant cette période.
                    </td>
                  </tr>
                `
                : ""}
            </tbody>
          </table>
        </div>
      </div>
    `;

  } catch (error) {
    console.error("Rapports :", error);

    results.innerHTML = `
      <div class="card">
        Erreur de génération du rapport :
        ${escapeHTML(error.message)}
      </div>
    `;
  }
}

        <p>Suivi des ventes et du stock</p>
      </div>

// ------------------------------------------------------
// GENERER LES RAPPORTS
// ------------------------------------------------------

async function generateReports() {
  const results = $("reportResults");
  if (!results) return;

  const startDate = $("reportStartDate")?.value;
  const endDate = $("reportEndDate")?.value;

  if (!startDate || !endDate || startDate > endDate) {
    toast("Période de rapport invalide.");
    return;
  }

  results.innerHTML = `
    <div class="card">Chargement des données...</div>
  `;

  try {
    let query = supabaseClient
      .from("sales")
      .select("*")
      .gte("created_at", startDate + "T00:00:00")
      .lte("created_at", endDate + "T23:59:59")
      .order("created_at", { ascending: false });

    if (!isSuperAdmin() && currentBranch) {
      query = query.eq("branch_id", currentBranch.id);
    } else if (isSuperAdmin() && currentBranch) {
      query = query.eq("branch_id", currentBranch.id);
    }

    const { data: sales, error } = await query;

    if (error) throw error;

    await loadStock();

    const rows = sales || [];

    const totalSales = rows.reduce(
      (sum, sale) =>
        sum + Number(
          sale.total_amount ??
          sale.total ??
          0
        ),
      0
    );

    const totalDiscount = rows.reduce(
      (sum, sale) =>
        sum + Number(
          sale.discount_amount ??
          sale.discount ??
          0
        ),
      0
    );

    const stockUnits = stockCache.reduce(
      (sum, batch) =>
        sum + Number(batch.quantity_base_units || 0),
      0
    );

    const stockValue = stockCache.reduce(
      (sum, batch) =>
        sum +
        Number(batch.quantity_base_units || 0) *
        Number(batch.purchase_price || 0),
      0
    );

    results.innerHTML = `
      <div class="stats-grid">

        <div class="stat-card">
          <span>Nombre de ventes</span>
          <strong>${rows.length}</strong>
        </div>

        <div class="stat-card">
          <span>Chiffre d'affaires</span>
          <strong>${formatMoney(totalSales)}</strong>
        </div>

        <div class="stat-card">
          <span>Remises accordées</span>
          <strong>${formatMoney(totalDiscount)}</strong>
        </div>

        <div class="stat-card">
          <span>Unités en stock</span>
          <strong>${stockUnits}</strong>
        </div>

        <div class="stat-card">
          <span>Valeur d'achat du stock</span>
          <strong>${formatMoney(stockValue)}</strong>
        </div>

      </div>

      <div class="card">
        <h3>Détail des ventes</h3>

        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Facture</th>
                <th>Client</th>
                <th>Paiement</th>
                <th>Total</th>
              </tr>
            </thead>

            <tbody>
              ${rows.map(sale => `
                <tr>
                  <td>${displayValue(formatDate(sale.created_at))}</td>

                  <td>
                    ${displayValue(
                      sale.invoice_number ||
                      sale.sale_number ||
                      sale.id
                    )}
                  </td>

                  <td>${displayValue(sale.customer_name)}</td>

                  <td>${displayValue(sale.payment_method)}</td>

                  <td>
                    ${formatMoney(
                      sale.total_amount ??
                      sale.total ??
                      0
                    )}
                  </td>
                </tr>
              `).join("")}

              ${rows.length === 0
                ? `
                  <tr>
                    <td colspan="5" class="empty-state">
                      Aucune vente pendant cette période.
                    </td>
                  </tr>
                `
                : ""}
            </tbody>
          </table>
        </div>
      </div>
    `;

  } catch (error) {
    console.error("Rapports :", error);

    results.innerHTML = `
      <div class="card">
        Erreur de génération du rapport :
        ${escapeHTML(error.message)}
      </div>
    `;
  }
}

// ------------------------------------------------------
// CHARGER HISTORIQUE
// ------------------------------------------------------

async function loadHistory() {
  const container = $("historyResults");
  if (!container) return;

  try {
    const { data, error } = await supabaseClient
      .from("audit_logs")
      .select("*")
      .order("created_at", { ascending: false })
      .limit(100);

    if (error) throw error;

    const logs = data || [];

    container.innerHTML = `
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Action</th>
              <th>Type d'objet</th>
              <th>Utilisateur</th>
            </tr>
          </thead>

          <tbody>
            ${logs.map(log => `
              <tr>
                <td>${displayValue(formatDate(log.created_at))}</td>

                <td>${displayValue(log.action)}</td>

                <td>${displayValue(log.entity_type)}</td>

                <td>
                  ${displayValue(
                    log.user_id ||
                    log.actor_id ||
                    "—"
                  )}
                </td>
              </tr>
            `).join("")}

            ${logs.length === 0
              ? `
                <tr>
                  <td colspan="4" class="empty-state">
                    Aucun historique disponible.
                  </td>
                </tr>
              `
              : ""}
          </tbody>
        </table>
      </div>
    `;

  } catch (error) {
    console.error("Historique :", error);

    container.innerHTML = `
      <p>
        Erreur historique :
        ${escapeHTML(error.message)}
      </p>
    `;
  }
}

function checkPageFunction(functionName) {
  if (typeof window[functionName] !== "function") {
    console.error("Fonction introuvable :", functionName);

    return false;
  }

  return true;
}

// ------------------------------------------------------

function hasActiveSession() {
  return Boolean(
    currentUser &&
    currentProfile &&
    currentProfile.is_active !== false
  );
}


function verifyApplicationSession() {
  if (!hasActiveSession()) {
    showLogin();
    return false;
  }

  return true;
}


// ------------------------------------------------------
// EVENEMENTS PHARMACIES, RAPPORTS ET HISTORIQUE
// ------------------------------------------------------

const pageContent = $("pageContent");

if (pageContent && !pageContent.dataset.navigationEvents) {

  pageContent.dataset.navigationEvents = "true";

  pageContent.addEventListener("click", async event => {

    try {

      // OUVRIR UNE PHARMACIE
      const branchButton =
        event.target.closest("[data-open-branch]");

      if (branchButton) {

        event.preventDefault();

        if (!verifyApplicationSession()) return;

        const branchId = branchButton.dataset.openBranch;

        if (!branchId) {
          toast("Pharmacie invalide.");
          return;
        }

        await changeBranch(branchId);
        return;
      }


      // ACTUALISER LES RAPPORTS
      if (event.target.closest("#refreshReportsButton")) {

        event.preventDefault();

        if (!verifyApplicationSession()) return;

        if (!checkPageFunction("generateReports")) return;

        await generateReports();
        return;
      }


      // ACTUALISER L'HISTORIQUE
      if (event.target.closest("#refreshHistoryButton")) {

        event.preventDefault();

        if (!verifyApplicationSession()) return;

        if (!checkPageFunction("loadHistory")) return;

        await loadHistory();
        return;
      }

    } catch (error) {

      console.error("Erreur événement navigation :", error);

      toast("Une erreur est survenue. Réessayez.");

    }

  });

}
